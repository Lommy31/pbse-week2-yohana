openapi: 3.1.0

info:
  title: Library Study Room Booking API
  version: 0.1.0
  description: |
    An API for students to find available study rooms and create and manage study room bookings.

    All booking durations are expressed in minutes. All timestamps are RFC 3339 with a
    timezone offset. Clients MUST ignore response fields they do not recognise, and MUST
    NOT crash when they see a status value they do not know.

servers:
  - url: https://api.example.com/v1
    description: Production — does not exist yet. That is Meeting 3.
  - url: http://localhost:8080/v1
    description: Local development

tags:
  - name: Things
    description: TODO — rename to your primary resource.

paths:

  /rooms:
    get:
      operationId: listRooms
      summary: List study rooms
      tags: [Things]
      description: |
        Returns all study rooms. Unavailable rooms are included so
        clients can display their current availability.
      parameters:
        - name: availability
          in: query
          required: false
          description: Filter rooms by availability.
          schema:
            type: string
            enum: [available, occupied, maintenance]
        - name: limit
          in: query
          required: false
          description: Maximum number of rooms to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous page's nextCursor.
          schema: { type: string }
      responses:
        '200':
          description: A page of study rooms.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/StudyRoom' }
                  nextCursor:
                    type: string
                    description: Absent on the last page.
                    example: eyJvIjoyMH0
        '400': { $ref: '#/components/responses/BadRequest' }

  /bookings:
    post:
      operationId: createBooking
      summary: Create a study room booking
      tags: [Things]
      description: |
        Creates a study room booking. The client generates the
        Idempotency-Key when the user confirms the booking and reuses
        the same key unchanged for every retry of that same booking
        request. The server remembers the key for 24 hours.
        Reusing the same key with a different request body returns
        409 idempotency-key-reuse.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          example: 0f7c1b9e-3d21-4a6f-9c05-8e2b7d41a9f0
          description: |
            Generated Idempotency-Key is a version-4 UUID with hyphens. Required on POST /v1/bookings. Ignored everywhere else. Keys are kept for 24 hours. A key reused after that is treated as new. 409 Conflict with type https://api.example.com/problems/idempotency-key-reuse is returned if the same key is used with different contents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
      responses:
        '201':
          description: |
            Booking created — or, on a retry with the same key and the
            same body, the original response is replayed.
          headers:
            Location:
              description: URI of the created booking.
              schema:
                type: string
              example: /v1/bookings/book_R01A9
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  schemas:
    StudyRoom:
      type: object
      required: [id, name, capacity, location, availability]
      properties:
        id:
          type: string
          pattern: '^room_[A-Za-z0-9]{3,}$'
          example: room_R01
        name:
          type: string
          example: Study Room A
        capacity:
          type: integer
          example: 30
        location:
          type: string
          example: 2nd Floor
        availability:
          type: string
          example: available

    Booking:
      type: object
      required: [id, roomId, studentId, startTime, endTime, status]
      properties:
        id:
          type: string
          pattern: '^book_[A-Za-z0-9]{3,}$'
          description: Opaque, server-generated, stable forever.
          example: book_R01A9

        roomId:
          type: string
          pattern: '^room_[A-Za-z0-9]{3,}$'
          description: ID of the study room being booked.
          example: room_R01

        studentId:
          type: string
          description: ID of the student who made the booking.
          example: student_123

        startTime:
          type: string
          format: date-time
          description: Start time of the booking in RFC 3339 format.
          example: '2026-09-02T10:00:00+07:00'

        endTime:
          type: string
          format: date-time
          description: End time of the booking in RFC 3339 format.
          example: '2026-09-02T12:00:00+07:00'

        status:
          type: string
          enum: [confirmed, cancelled, completed]
          description: Current status of the booking.
          example: confirmed

    # ---------------------------------------------------------------
    # RFC 9457 Problem Details. Defined ONCE, referenced everywhere,
    # so that a client able to parse one of your errors can parse all
    # of them. Extension members go alongside these five.
    # ---------------------------------------------------------------
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          example: https://api.example.com/problems/room-unavailable
        title:
          type: string
          example: Study room is unavailable
        status:
          type: integer
          example: 409
        detail:
          type: string
        instance:
          type: string

  responses:

    BadRequest:
      description: The request was malformed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.example.com/problems/malformed-request
            title: The request could not be parsed
            status: 400

    Conflict:
      description: The request was valid but refused by a business rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    UnprocessableEntity:
      description: Well-formed but semantically invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.example.com/problems/validation-failed
            title: One or more fields are invalid
            status: 422